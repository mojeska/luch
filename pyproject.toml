[project]
name = "luch"
version = "0.1.0"
description = "ЛУЧ: MeshCore terminal over Bluetooth, logs everything to SQLite"
requires-python = ">=3.11"
dependencies = ["meshcore>=2.3", "textual>=8.0"]
license = "MIT"
readme = "README.md"

[project.scripts]
luch = "luch.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
luch = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
